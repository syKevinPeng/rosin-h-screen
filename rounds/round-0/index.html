<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Atom audit · round 0</title>
<style>
:root{--bg:#f7f6f2;--card:#ffffff;--ink:#1d1d1b;--muted:#6b6a66;--line:#e2e0d9;--accent:#3b5bdb;--accent-ink:#ffffff;--warn:#c92a2a;--tag:#eef0f5}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--ink:#ecebe6;--muted:#a3a29b;--line:#34332f;--accent:#8fa3ff;--accent-ink:#0f1330;--warn:#ff8787;--tag:#2a2b31}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 1rem .5rem;z-index:2}
.hrow{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:center;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.hrow code{font-size:.78rem}
.lang button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:.1rem .6rem;cursor:pointer;font:inherit;font-size:.78rem}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.progress{height:4px;background:var(--line);border-radius:2px;margin:.45rem auto 0;max-width:760px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;width:0;transition:width .2s}
main{max-width:760px;margin:0 auto;padding:1.2rem 1rem 4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.2rem 1.3rem;margin-bottom:1rem}
h1{font-size:1.5rem;margin:.2rem 0 .6rem;line-height:1.25}
h2{font-size:1.2rem;margin:0 0 .25rem;line-height:1.3}
h3{font-size:1rem;margin:1rem 0 .3rem}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;color:var(--muted)}
.badge{display:inline-block;font-size:.7rem;padding:.05rem .5rem;border-radius:999px;background:var(--tag);color:var(--muted);margin-left:.4rem;vertical-align:middle;font-weight:400}
.banner{background:var(--tag);border-left:4px solid var(--accent);padding:.5rem .8rem;border-radius:6px;margin:0 0 .8rem;font-size:.9rem}
dl{margin:.8rem 0 0}
dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:.75rem}
dd{margin:.15rem 0 0}
ul.phr{margin:.15rem 0 0;padding-left:1.1rem}
ul.phr li{margin:.2rem 0}
.src{font-size:.78rem;color:var(--muted)}
.q{margin-top:1.1rem;padding-top:.9rem;border-top:1px dashed var(--line)}
.q p{margin:0 0 .55rem;font-weight:600}
.gloss{font-weight:400;color:var(--muted);font-size:.88rem}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.seg label{border:1px solid var(--line);border-radius:8px;padding:.45rem .25rem;text-align:center;cursor:pointer;font-size:.82rem;line-height:1.25;user-select:none}
.seg label b{display:block;font-size:1.1rem}
.seg input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:checked+label .zh{color:inherit}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:4.5rem;border:1px solid var(--line);border-radius:8px;padding:.5rem;font:inherit;background:var(--bg);color:var(--ink)}
.nav{display:flex;justify-content:space-between;gap:.6rem;margin-top:1.1rem}
button.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:.6rem 1.1rem;font:inherit;font-weight:600;cursor:pointer}
button.btn[disabled]{opacity:.45;cursor:not-allowed}
button.btn .zh{color:inherit;opacity:.85}
button.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.8rem}
.warn{color:var(--warn);font-size:.85rem;margin-top:.5rem;min-height:1.2em}
.muted{color:var(--muted);font-size:.9rem}
.zh{display:block;color:var(--muted)}
.pair.inline .zh{display:inline;margin-left:.4em}
body.lang-en .zh{display:none}
body.lang-zh .en{display:none}
body.lang-zh .zh{color:inherit}
.list{list-style:none;padding:0;margin:.5rem 0}
.list li{display:flex;justify-content:space-between;gap:.5rem;border-bottom:1px solid var(--line);padding:.35rem 0;font-size:.9rem}
.list a{color:var(--accent)}
.ok{color:var(--accent)}
pre.csv{white-space:pre;overflow:auto;font-size:.72rem;background:var(--tag);padding:.6rem;border-radius:8px;max-height:14rem}
@media print{
  header,.nav,.noprint{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .card{break-inside:avoid;border-color:#999;padding:.7rem .9rem;margin-bottom:.6rem}
  .zh{color:#333}
  .seg label{border-color:#777;padding:.25rem}
  .seg input:checked+label{background:none;color:#000}
  textarea{min-height:3rem;border-color:#777;background:#fff}
}
</style>
</head>

":"正在演奏的音高"},"phrases":[{"text":"constant adjustment","lang":"en","tag":"verbatim","source":"Galamian, Principles of Violin Playing and Teaching (1962)","locator":"T:49"},{"text":"flat 3rd finger","lang":"en","tag":"synthesis","source":"Hamann & Gillespie, Strategies for Teaching Strings (4th ed., 2018)","locator":"T:158"},{"text":"准","lang":"zh","tag":"verbatim","source":"林耀基 口诀，见 杨宝智《林耀基小提琴教学法精要》(2004)","locator":"C:24"},{"text":"音准","lang":"zh","tag":"verbatim","source":"肖柯 (2016)；麻西水 (2002)，文章标题","locator":"C:110"},{"text":"the note you are playing","lang":"en","tag":"uncited","source":"","locator":""}],"definition":{"en":"The pitch the violin is sounding at each moment, tracked continuously, so vibrato, slides and out-of-tune notes all show.","zh":"每一时刻小提琴发出的音高，连续跟踪，因此揉弦、滑音和音不准都会体现出来。"},"unit":{"en":"piano-key numbers with fractions; a step of 1 is one semitone","zh":"钢琴键号（带小数）；每 1 为一个半音"},"range":{"en":"higher = higher pitch, over the violin's range from the open G string upward","zh":"越高音越高，覆盖从空弦 G 起的小提琴音域"}},{"id":"f0_salience","group":"audio","status":"registered","name":{"en":"Pitch clarity: how clearly a pitch is present","zh":"音高清晰度（声音里有多明确的音高）"},"phrases":[{"text":"It is impossible to scratch if the bow keeps moving","lang":"en","tag":"verbatim","source":"Fischer, The Violin Lesson (2013), chapter heading","locator":"T:23"},{"text":"scratchy tone","lang":"en","tag":"synthesis","source":"Hamann & Gillespie, Strategies for Teaching Strings (4th ed., 2018)","locator":"T:158"},{"text":"tonalization","lang":"en","tag":"verbatim","source":"Suzuki, as described in Starr, The Suzuki Violinist","locator":"T:94"},{"text":"匀、美","lang":"zh","tag":"verbatim","source":"林耀基 口诀，见 杨宝智《林耀基小提琴教学法精要》(2004)","locator":"C:24"},{"text":"clean, focused tone","lang":"en","tag":"uncited","source":"","locator":""},{"text":"声音干净 / 有核心","lang":"zh","tag":"uncited","source":"","locator":""}],"definition":{"en":"How clearly a definite pitch is present in the sound at each moment: hig ang":"en","tag":"synthesis","source":"Gerle, The Art of Practising the Violin (1983)","locator":"T:122"},{"text":"换把 / 手型","lang":"zh","tag":"verbatim","source":"丁芷诺《小提琴基本功强化训练教材》（上海音乐出版社）","locator":"C:64"},{"text":"stay in third position","lang":"en","tag":"uncited","source":"","locator":""}],"definition":{"en":"Where on the fingerboard the left hand actually was for the note, compared with the position the written music implies.","zh":"演奏这个音时左手实际所在的把位，与乐谱暗示的把位相比较。"},"unit":{"en":"semitones along the string","zh":"沿弦的半音数"},"range":{"en":"0 = the position the score implies; positive = higher up the fingerboard than implied; negative = lower","zh":"0 = 乐谱暗示的把位；正值 = 比暗示的更靠上（高把位）；负值 = 更靠下"}},{"id":"contact_bridge_ratio_neutral","group":"bow-string","status":"registered","name":{"en":"The player's habitual sounding point","zh":"演奏者惯常的触弦点"},"phrases":[{"text":"soundpoint / the five soundpoints","lang":"en","tag":"synthesis","source":"Fischer, The Violin Lesson (2013)","locator":"T:23"},{"text":"contact point","lang":"en","tag":"synthesis","source":"Flesch, The Art of Violin Playing, Book 1","locator":"T:40"},{"text":"the bow drifting from the contact point","lang":"en","tag":"synthesis","source":"Starr, The Suzuki Violinist","locator":"T:76"},{"text":"匀","lang":"zh","tag":"verbatim","source":"林耀基 口诀，见 杨宝智《林耀基小提琴教学法精要》(2004)","locator":"C:24"},{"text":"playing too close to the fingerboard / too close to the bridge","lang":"en","tag":"uncited","source":"","locator":""},{"text":"触弦点","lang":"zh","tag":"uncited","source":"","locator":""}],"definition":{"en":"The player's usual contact point in that recording: where along the string the bow hair most often sits, between the bridge and the fingerboard.","zh":"演奏者在这次录音中惯常的触弦点：弓毛在琴马与指板之间最常处的位置。"},"unit":{"en":"a fraction of the string length (bridge to nut)","zh":"弦长（琴马到琴枕）的比例"},"range":{"en":"0 = at the bridge; larger = further toward the fingerboard; one value per recording, not per moment","zh":"0 = 在琴马处；越大 = 越靠近指板；每段录音一个值，而 <script>
// Deterministic per-rater card order. Shared verbatim between the page
// (inlined by scripts/build.py) and the Node test, and ported line-for-line
// to scripts/order.py so the committed CSV can be checked against it.
//
// order = anchors (fixed order, is_anchor=1) + shuffle(data rows, seed)
// seed  = fnv1a(form_version + "|" + rater)   -> 32-bit
// shuffle = Fisher-Yates driven by mulberry32(seed)
// anchor_policy "repeat": anchor atoms appear AGAIN inside the shuffled data
// block (is_anchor=0, seen_as_calibration=1); "once": they do not.
(function (root) {
  function fnv1a(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, seed) {
    var a = arr.slice(), rnd = mulberry32(seed);
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function buildOrder(ids, anchors, policy, formVersion, rater) {
    var dataIds = ids.filter(function (id) {
      return policy === "repeat" || anchors.indexOf(id) < 0;
    });
    var seed = fnv1a(formVersion + "|" + rater);
    var out = anchors.map(function (id) { return { id: id, is_anchor: 1 }; });
    shuffle(dataIds, seed).forEach(function (id) {
      out.push({ id: id, is_anchor: 0 });
    });
    return out;
  }
  var api = { fnv1a: fnv1a, mulberry32: mulberry32, shuffle: shuffle, buildOrder: buildOrder };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.HOrder = api;
})(typeof window !== "undefined" ? window : this);

</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("rows-json").textContent);
  var FORM_VERSION = "cf35edf19d24";
  var ROUND = DATA.round;
  var UI = DATA.ui;
  var ORDER = window.HOrder;
  var ROWS = {};
  DATA.rows.forEach(function (r) { ROWS[r.id] = r; });
  var params = new URLSearchParams(location.search);
  var MODE = params.get("mode") === "print" ? "print" : "rate";
  var app = document.getElementById("app");
  var state = null;

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fill(s, vars) {
    return String(s).replace(/\{(\w+)\}/g, function (m, k) { return vars && k in vars ? vars[k] : m; });
  }
  function t(o, inline, vars) {
    return '<span class="pair' + (inline ? " inline" : "") + '"><span class="en">' + esc(fill(o.en, vars)) +
      '</span><span class="zh">' + esc(fill(o.zh, vars)) + "</span></span>";
  }
  function nowISO() { return new Date().toISOString(); }
  function skey(r) { return "hscreen:" + ROUND + ":" + FORM_VERSION + ":" + r; }
  function akey(o) { return o.id + "#" + o.is_anchor; }
  function loadState(r) {
    try { var s = localStorage.getItem(skey(r)); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function saveState() {
    if (!state) return;
    try { localStorage.setItem(skey(state.rater), JSON.stringify(state)); } catch (e) { /* storage unavailable: page still works for one sitting */ }
  }
  function newState(r) {
    return {
      round: ROUND, form_version: FORM_VERSION, rater: r,
      started_at: null, finished_at: null, idx: 0, view: "intro",
      order: ORDER.buildOrder(DATA.rows.map(function (x) { return x.id; }), DATA.anchors, DATA.anchor_policy, FORM_VERSION, r),
      answers: {}
    };
  }
  function answered(o) {
    var a = state.answers[akey(o)];
    return !!(a && a.h1 && a.h2);
  }
  function nAnswered() { return state.order.filter(answered).length; }

  // ---------- language ----------
  function setLang(l) {
    document.body.className = l === "both" ? "" : "lang-" + l;
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === l ? "true" : "false");
    });
    try { localStorage.setItem("hscreen:lang", l); } catch (e) {}
  }
  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
  });
  (function () { var l = null; try { l = localStorage.getItem("hscreen:lang"); } catch (e) {} setLang(l || "both"); })();

  // ---------- header ----------
  function renderHeader() {
    document.getElementById("stamp-round").innerHTML = t(DATA.round_label, true);
    document.getElementById("stamp-version").innerHTML = t(UI.version, true);
    var r = state ? state.rater : null;
    document.getElementById("stamp-rater").innerHTML = r ? t(UI.rater, true) + ": " + t(UI.rater_names[r], true) : "";
    var n = state ? state.order.length : 1;
    document.getElementById("bar").style.width = state ? Math.round(100 * nAnswered() / n) + "%" : "0%";
  }

  // ---------- pieces ----------
  function phrasesHTML(r) {
    return r.phrases.map(function (p) {
      var label = UI.tag_labels[p.tag] || { en: p.tag, zh: p.tag };
      var src = p.tag === "uncited" ? "" : (p.source ? ": " + esc(p.source) : "");
      return "<li>" + esc(p.text) + ' <span class="src">· ' + t(label, true) + src + "</span></li>";
    }).join("");
  }
  function descHTML(r) {
    return "<dl><dt>" + t(UI.phrases, true) + '</dt><dd><ul class="phr">' + phrasesHTML(r) + "</ul></dd>" +
      "<dt>" + t(UI.definition, true) + "</dt><dd>" + t(r.definition) + "</dd>" +
      "<dt>" + t(UI.unit, true) + "</dt><dd>" + t(r.unit) + "</dd>" +
      "<dt>" + t(UI.range, true) + "</dt><dd>" + t(r.range) + "</dd></dl>";
  }
  function titleHTML(r) {
    return "<h2>" + t(r.name, true) + (r.status === "incoming-v18" ? '<span class="badge">' + t(UI.incoming, true) + "</span>" : "") +
      '</h2><div class="code">' + esc(r.id) + "</div>";
  }
  function questionHTML(q, text, gloss, val, nameSuffix) {
    var name = q + (nameSuffix || "");
    var s = '<div class="q"><p>' + t(text) + (gloss ? '<span class="gloss">' + t(gloss) + "</span>" : "") + '</p><div class="seg">';
    DATA.scale.forEach(function (o) {
      var id = name + "-" + o.value;
      s += '<input type="radio" name="' + name + '" id="' + id + '" value="' + o.value + '"' + (val === o.value ? " checked" : "") +
        ' data-q="' + q + '"><label for="' + id + '"><b>' + o.value + "</b>" + t(o) + "</label>";
    });
    return s + "</div></div>";
  }
  function introBody() {
    var n = state ? state.order.length : DATA.anchors.length + DATA.rows.length;
    var s = "<h1>" + t(DATA.title, true) + ' <span class="badge">' + t(DATA.round_label, true) + "</span></h1>" +
      "<p>" + t(DATA.intro, false, { n: n }) + "</p>" +
      "<h3>" + t(UI.questions_heading, true) + "</h3>" +
      "<p><b>H1.</b> " + t(DATA.questions.h1) + "</p><p><b>H2.</b> " + t(DATA.questions.h2) + '<span class="gloss">' + t(DATA.questions.h2_gloss) + "</span></p>" +
      "<h3>" + t(UI.scale_heading, true) + "</h3>" + '<div class="seg" aria-hidden="true">' +
      DATA.scale.map(function (o) { return "<label><b>" + o.value + "</b>" + t(o) + "</label>"; }).join("") + "</div>";
    return s;
  }

  // ---------- views ----------
  function renderIntro() {
    var s = '<div class="card">' + introBody() + '<p class="muted">' + t(UI.saved_hint) + "</p>";
    if (!state) {
      s += "<h3>" + t(UI.pick_rater, true) + '</h3><div class="row">' + DATA.raters.map(function (r) {
        return '<button type="button" class="btn ghost" data-pick="' + r + '">' + t(UI.rater_names[r], true) + "</button>";
      }).join("") + "</div>";
    } else {
      var started = state.started_at && nAnswered() > 0;
      s += '<div class="row"><button type="button" class="btn" id="start">' + t(started ? UI["continue"] : UI.start, true) + "</button>" +
        (started ? '<button type="button" class="btn ghost" id="restart" data-armed="0">' + t(UI.start_over, true) + "</button>" : "") + "</div>";
    }
    s += "</div>";
    app.innerHTML = s;
  }
  function renderCard(i) {
    var o = state.order[i], r = ROWS[o.id], a = state.answers[akey(o)] || {};
    if (!a.shown_at) { a.shown_at = nowISO(); state.answers[akey(o)] = a; saveState(); }
    var n = state.order.length;
    var s = '<div class="card"><div class="code">' + t(UI.card_of, true, { i: i + 1, n: n }) + "</div>" +
      (o.is_anchor ? '<div class="banner">' + t(UI.calibration, true) + "</div>" : "") +
      titleHTML(r) + descHTML(r) +
      questionHTML("h1", DATA.questions.h1, null, a.h1) +
      questionHTML("h2", DATA.questions.h2, DATA.questions.h2_gloss, a.h2) +
      '<div class="q"><p>' + t(UI.note_prompt) + '</p><textarea id="note" rows="3">' + esc(a.note || "") + "</textarea></div>" +
      '<div class="warn" id="warn"></div>' +
      '<div class="nav"><button type="button" class="btn ghost" id="back"' + (i === 0 ? " disabled" : "") + ">" + t(UI.back, true) + "</button>" +
      '<button type="button" class="btn" id="next">' + t(i === n - 1 ? UI.finish : UI.next, true) + "</button></div></div>";
    app.innerHTML = s;
    window.scrollTo(0, 0);
  }
  function records() {
    return state.order.map(function (o, pos) {
      var a = state.answers[akey(o)] || {};
      return {
        round: ROUND, form_version: FORM_VERSION, rater: state.rater, position: pos + 1, atom: o.id,
        is_anchor: o.is_anchor, seen_as_calibration: (o.is_anchor === 0 && DATA.anchors.indexOf(o.id) >= 0) ? 1 : 0,
        h1: a.h1 || "", h2: a.h2 || "", note: a.note || "",
        shown_at: a.shown_at || "", answered_at: a.answered_at || "",
        started_at: state.started_at || "", finished_at: state.finished_at || ""
      };
    });
  }
  var COLS = ["round", "form_version", "rater", "position", "atom", "is_anchor", "seen_as_calibration", "h1", "h2", "note", "shown_at", "answered_at", "started_at", "finished_at"];
  function csvCell(v) {
    var s = String(v == null ? "" : v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(recs) {
    return [COLS.join(",")].concat(recs.map(function (r) { return COLS.map(function (c) { return csvCell(r[c]); }).join(","); })).join("\r\n") + "\r\n";
  }
  function toJSON() {
    return JSON.stringify({ round: ROUND, form_version: FORM_VERSION, rater: state.rater, started_at: state.started_at, finished_at: state.finished_at, records: records() }, null, 2);
  }
  function fileBase() { return "h-screen-round" + ROUND + "-" + state.rater + "-" + FORM_VERSION; }
  function download(name, text, mime) {
    var b = new Blob([text], { type: mime }), u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 0);
  }
  function elapsedText() {
    if (!state.started_at || !state.finished_at) return "";
    var ms = new Date(state.finished_at) - new Date(state.started_at);
    var m = Math.floor(ms / 60000), s = Math.round((ms % 60000) / 1000);
    return m + " min " + s + " s";
  }
  function renderFinish() {
    var missing = state.order.map(function (o, i) { return answered(o) ? null : i; }).filter(function (x) { return x !== null; });
    var s = '<div class="card"><h1>' + t(UI.finish, true) + "</h1>";
    if (missing.length) {
      s += '<p class="warn">' + t(UI.unanswered) + '</p><ul class="list">' + missing.map(function (i) {
        return "<li><span>" + (i + 1) + ". " + t(ROWS[state.order[i].id].name, true) + '</span><a href="#" data-goto="' + i + '">' + t(UI.jump, true) + "</a></li>";
      }).join("") + "</ul>";
    } else {
      s += "<p>" + t(UI.finish_text) + "</p>" +
        '<p class="muted">' + t(UI.elapsed, true) + ": " + elapsedText() + " · " + t(UI.your_answers, true) + ": " + nAnswered() + " / " + state.order.length + "</p>" +
        '<div class="row"><button type="button" class="btn" id="dl-csv">' + t(UI.download_csv, true) + "</button>" +
        '<button type="button" class="btn" id="dl-json">' + t(UI.download_json, true) + "</button>" +
        '<button type="button" class="btn ghost" id="copy-csv">' + t(UI.copy_csv, true) + '</button><span class="ok" id="copied"></span></div>' +
        '<p class="muted">' + t(UI.send_hint) + "</p>" +
        '<pre class="csv" id="csv-preview">' + esc(toCSV(records())) + "</pre>";
    }
    s += '<div class="row noprint"><button type="button" class="btn ghost" id="review">' + t(UI.review, true) + "</button>" +
      '<button type="button" class="btn ghost" id="restart" data-armed="0">' + t(UI.start_over, true) + "</button></div></div>";
    app.innerHTML = s;
    window.scrollTo(0, 0);
  }
  function renderPrint() {
    var fixed = DATA.anchors.map(function (id) { return { id: id, is_anchor: 1 }; }).concat(
      DATA.rows.filter(function (r) { return DATA.anchor_policy === "repeat" || DATA.anchors.indexOf(r.id) < 0; })
        .map(function (r) { return { id: r.id, is_anchor: 0 }; }));
    var s = '<div class="card">' + introBody() + '<p class="muted">' + t(UI.print_title) + "</p>" +
      "<p>" + t(UI.rater, true) + ": " + DATA.raters.map(function (r) { return "☐ " + t(UI.rater_names[r], true); }).join(" &nbsp; ") +
      ' &nbsp; <span class="code">' + t(UI.version, true) + " " + FORM_VERSION + "</span></p>" +
      '<div class="row noprint"><button type="button" class="btn" onclick="window.print()">' + t(UI.print_button, true) + "</button></div></div>";
    fixed.forEach(function (o, i) {
      var r = ROWS[o.id];
      s += '<div class="card"><div class="code">' + t(UI.card_of, true, { i: i + 1, n: fixed.length }) + "</div>" +
        (o.is_anchor ? '<div class="banner">' + t(UI.calibration, true) + "</div>" : "") + titleHTML(r) + descHTML(r) +
        questionHTML("h1", DATA.questions.h1, null, null, "-p" + i) + questionHTML("h2", DATA.questions.h2, DATA.questions.h2_gloss, null, "-p" + i) +
        '<div class="q"><p>' + t(UI.note_prompt) + '</p><textarea rows="2"></textarea></div></div>';
    });
    app.innerHTML = s;
  }
  function render() {
    renderHeader();
    if (MODE === "print") { renderPrint(); return; }
    if (!state || state.view === "intro") renderIntro();
    else if (state.view === "card") renderCard(state.idx);
    else renderFinish();
  }

  // ---------- events ----------
  app.addEventListener("click", function (ev) {
    var el = ev.target.closest("button, a"); if (!el) return;
    if (el.hasAttribute("data-pick")) {
      var r = el.getAttribute("data-pick");
      var u = new URL(location.href); u.searchParams.set("rater", r); history.replaceState(null, "", u.toString());
      state = loadState(r) || newState(r); saveState(); render(); return;
    }
    if (!state) return;
    if (el.id === "start") { if (!state.started_at) state.started_at = nowISO(); state.view = "card"; saveState(); render(); return; }
    if (el.id === "restart") {
      if (el.getAttribute("data-armed") !== "1") { el.setAttribute("data-armed", "1"); el.innerHTML = t(UI.start_over_confirm, true); return; }
      var rr = state.rater; try { localStorage.removeItem(skey(rr)); } catch (e) {}
      state = newState(rr); saveState(); render(); return;
    }
    if (el.id === "next") {
      var o = state.order[state.idx];
      if (!answered(o)) { document.getElementById("warn").innerHTML = t(UI.unanswered, true); return; }
      if (state.idx === state.order.length - 1) { state.view = "finish"; if (!state.finished_at) state.finished_at = nowISO(); }
      else state.idx += 1;
      saveState(); render(); return;
    }
    if (el.id === "back") { if (state.idx > 0) { state.idx -= 1; saveState(); render(); } return; }
    if (el.id === "review") { state.view = "card"; state.idx = 0; saveState(); render(); return; }
    if (el.hasAttribute("data-goto")) { ev.preventDefault(); state.view = "card"; state.idx = +el.getAttribute("data-goto"); saveState(); render(); return; }
    if (el.id === "dl-csv") { download(fileBase() + ".csv", toCSV(records()), "text/csv;charset=utf-8"); return; }
    if (el.id === "dl-json") { download(fileBase() + ".json", toJSON(), "application/json;charset=utf-8"); return; }
    if (el.id === "copy-csv") {
      var txt = toCSV(records()), done = function () { document.getElementById("copied").innerHTML = t(UI.copied, true); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt); done(); });
      else { fallbackCopy(txt); done(); }
      return;
    }
  });
  function fallbackCopy(txt) {
    var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {} ta.remove();
  }
  app.addEventListener("change", function (ev) {
    if (!state || state.view !== "card") return;
    var el = ev.target; if (el.type !== "radio") return;
    var o = state.order[state.idx], a = state.answers[akey(o)] || {};
    a[el.getAttribute("data-q")] = +el.value;
    if (a.h1 && a.h2) a.answered_at = nowISO();
    state.answers[akey(o)] = a; saveState(); renderHeader();
    document.getElementById("warn").innerHTML = "";
  });
  app.addEventListener("input", function (ev) {
    if (!state || state.view !== "card" || ev.target.id !== "note") return;
    var o = state.order[state.idx], a = state.answers[akey(o)] || {};
    a.note = ev.target.value; state.answers[akey(o)] = a; saveState();
  });

  // ---------- boot ----------
  var rater = params.get("rater");
  if (DATA.raters.indexOf(rater) < 0) rater = null;
  if (rater) { state = loadState(rater) || newState(rater); if (state.form_version !== FORM_VERSION) state = newState(rater); saveState(); }
  render();
})();
</script>
</body>
