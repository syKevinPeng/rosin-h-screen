<html lang="en">

<title>__TITLE__ · round __ROUND__</title>
<style>
:root{--bg:#f6f7fb;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#4f46e5;--accent-hover:#4338ca;--accent-ink:#ffffff;--accent-soft:#eef2ff;--warn:#dc2626;--ok:#16a34a;--chip:#f1f5f9;--shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#151b2e;--ink:#e6eaf3;--muted:#98a2b8;--line:#263049;--accent:#818cf8;--accent-hover:#a5b4fc;--accent-ink:#0b1020;--accent-soft:#1f2542;--warn:#f87171;--ok:#4ade80;--chip:#1c2340;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit}
/* header */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;padding:.7rem 1.25rem;display:flex;align-items:center;gap:.8rem}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:700;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.logo svg{width:28px;height:28px;flex:none}
.top .spacer{flex:1}
.status{display:flex;align-items:center;gap:.9rem;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.pill{background:var(--chip);border-radius:999px;padding:.2rem .7rem;font-weight:600;color:var(--ink);font-size:.85rem}
.progress{height:4px;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s cubic-bezier(.2,.8,.2,1)}
/* layout */
main{max-width:1040px;margin:0 auto;padding:2rem 1.25rem 6rem}
.view{animation:rise .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.progress i{transition:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.6rem 1.7rem;box-shadow:var(--shadow)}
.card+.card{margin-top:1rem}
h1{font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 .8rem;font-weight:800}
h2{font-size:1.35rem;line-height:1.3;letter-spacing:-.01em;margin:0 0 .6rem;font-weight:700}
h3{font-size:1.05rem;margin:0 0 .5rem;font-weight:700}
.lead{font-size:1.1rem;color:var(--muted);margin:0 0 1.3rem;max-width:62ch}
.k{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:.35rem}
.muted{color:var(--muted);font-size:.92rem}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:.8rem 1.35rem;font-weight:700;cursor:pointer;transition:background .15s,transform .05s,opacity .15s;text-decoration:none}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.38;cursor:not-allowed;transform:none}
.btn.lg{padding:1rem 1.6rem;font-size:1.05rem;border-radius:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn.ghost[disabled]{opacity:.38;cursor:not-allowed}
.btn.link{background:none;color:var(--accent);padding:.3rem .5rem}
.btn.link:hover{background:var(--accent-soft)}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:2rem;align-items:center;padding:1rem 0 2rem}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.meta{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.4rem}
.meta span{display:inline-flex;align-items:center;gap:.4rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem;font-size:.88rem;color:var(--muted)}
.meta svg{width:16px;height:16px;color:var(--accent)}
.illus{display:flex;justify-content:center}
.illus svg{width:100%;max-width:340px;height:auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:0 0 1.2rem}
@media (max-width:700px){.steps{grid-template-columns:1fr}}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem}
.step .n{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;margin-bottom:.6rem}
.twoq{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:0 0 1rem}
@media (max-width:700px){.twoq{grid-template-columns:1fr}}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem}
.qcard b{display:block;color:var(--accent);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.35rem}
.qcard p{margin:0;font-weight:600}
.gloss{display:block;font-weight:400;color:var(--muted);font-size:.9rem;margin-top:.35rem}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin:.4rem 0}
@media (max-width:560px){.legend{grid-template-columns:1fr 1fr}}
.legend div{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:.6rem .4rem;text-align:center;font-size:.9rem;line-height:1.3}
.legend b{display:block;font-size:1.1rem}
.raters{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:.5rem 0 0}
@media (max-width:600px){.raters{grid-template-columns:1fr}}
.rater{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.rater:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.rater b{display:block;font-size:1.05rem;margin-bottom:.15rem}
/* survey */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.sticky{position:sticky;top:76px}
@media (max-width:900px){.sticky{position:static}}
.ribbon{display:flex;align-items:center;gap:.5rem;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:.6rem .9rem;margin:0 0 1rem;font-weight:600;font-size:.95rem}
.atom{font-size:1.5rem;line-height:1.25;letter-spacing:-.01em;margin:0 0 1rem;font-weight:800}
.def{font-size:1.06rem;line-height:1.7;margin:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:0 0 1.1rem}
@media (max-width:560px){.facts{grid-template-columns:1fr}}
.facts>div{background:var(--bg);border-radius:12px;padding:.7rem .9rem;font-size:.95rem}
.phr{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.5rem}
.phr li{background:var(--chip);border-radius:10px;padding:.45rem .8rem;font-size:.95rem}
.phr q{quotes:"“" "”";font-weight:600}
.phr small{color:var(--muted);font-size:.82rem;margin-left:.4rem}
.q{padding:1.1rem 0 .5rem;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:.2rem}
.qlabel{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:.3rem}
.q p{margin:0 0 .75rem;font-weight:600;font-size:1.05rem}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem}
@media (max-width:560px){.seg{grid-template-columns:1fr 1fr}}
.seg input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.seg label{display:flex;flex-direction:column;align-items:center;gap:.25rem;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:.75rem .4rem;text-align:center;cursor:pointer;font-size:.88rem;line-height:1.25;user-select:none;transition:border-color .15s,background .15s,transform .05s}
.seg label b{display:inline-flex;align-items:center;justify-content:center;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--chip);font-size:1rem;font-weight:800}
.seg label:hover{border-color:var(--accent);background:var(--accent-soft)}
.seg label:active{transform:scale(.98)}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:checked+label b{background:rgba(255,255,255,.28);color:inherit}
.seg input:focus-visible+label{outline:3px solid var(--accent-soft);outline-offset:1px;border-color:var(--accent)}
textarea{width:100%;min-height:4.4rem;border:1.5px solid var(--line);border-radius:12px;padding:.75rem .9rem;font:inherit;font-size:.98rem;background:var(--card);color:var(--ink);resize:vertical;transition:border-color .15s}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:1.2rem;flex-wrap:wrap}
.hint{flex:1;color:var(--muted);font-size:.9rem;min-width:12rem}
.hint.warn{color:var(--warn)}
.kbd{color:var(--muted);font-size:.82rem;margin:.9rem 0 0}
.kbd kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 .4rem;font:inherit;font-size:.78rem;background:var(--card)}
/* review */
.rev{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rev li{display:grid;grid-template-columns:2.2rem 1fr auto auto auto;gap:.8rem;align-items:center;padding:.65rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
@media (max-width:640px){.rev li{grid-template-columns:2rem 1fr auto}.rev .ans{grid-column:2/-1;justify-self:start}}
.rev .i{color:var(--muted);font-variant-numeric:tabular-nums}
.rev .ans{display:inline-flex;gap:.35rem;align-items:center;font-size:.85rem;color:var(--muted);white-space:nowrap}
.rev .ans b{display:inline-flex;align-items:center;justify-content:center;min-width:1.6rem;height:1.6rem;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:800}
.rev .ans b.lo{background:var(--chip);color:var(--muted)}
.rev .star{color:var(--accent);font-size:.8rem}
/* done */
.done{text-align:center;padding:1.2rem 0 .5rem}
.done svg{width:72px;height:72px;margin-bottom:.6rem}
.callout{background:var(--accent-soft);border-radius:14px;padding:1rem 1.1rem;margin:1.1rem 0;text-align:left}
pre.csv{white-space:pre;overflow:auto;font-size:.74rem;background:var(--bg);padding:.8rem;border-radius:12px;max-height:14rem;margin:.6rem 0 0;text-align:left}
details summary{cursor:pointer;color:var(--muted)}
/* toast, footer, notice */
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:999px;font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.notice{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:12px;padding:.7rem 1rem;margin:0 0 1rem;font-size:.92rem}
footer.foot{max-width:1040px;margin:0 auto;padding:0 1.25rem 2rem;color:var(--muted);font-size:.82rem;display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;justify-content:space-between}
footer.foot code{font-size:.78rem}
@media print{
  .top,.nav,.noprint,.toast,footer.foot{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  main{padding:0;max-width:none}
  .card{break-inside:avoid;border-color:#999;box-shadow:none;padding:.7rem .9rem;margin-bottom:.6rem}
  .card+.card{margin-top:.6rem}
  .seg label{border-color:#777;padding:.3rem}
  .seg label b{background:none;border:1px solid #777}
  textarea{min-height:3rem;border-color:#777;background:#fff}
  .facts>div,.qcard,.phr li{background:#fff;border:1px solid #ddd}
  .view{animation:none}
}
</style>

  var state = null;

  }

  }

  function phrasesHTML(r) {

  function descHTML(r) {

      '<div><span class="k">' + t(UI.range) + "</span>" + t(r.range) + "</div></div>" +
      '<span class="k">' + t(UI.phrases) + '</span><ul class="phr">' + phrasesHTML(r) + "</ul>";
  }
  function infoCard(r, isAnchor) {
    return '<article class="card">' + (isAnchor ? '<div class="ribbon">★ ' + t(UI.calibration) + "</div>" : "") +
      '<h2 class="atom">' + t(r.name) + '</h2><p class="def">' + t(r.prose) + "</p></article>";
  }
  function questionHTML(q, label, text, gloss, val, suffix) {
    var name = q + (suffix || "");
    var s = '<div class="q"><div class="qlabel">' + t(label) + "</div><p>" + t(text) +
      (gloss ? '<span class="gloss">' + t(gloss) + "</span>" : "") + '</p><div class="seg" role="radiogroup">';
    DATA.scale.forEach(function (o) {
      var id = name + "-" + o.value;
      s += '<input type="radio" name="' + name + '" id="' + id + '" value="' + o.value + '"' + (val === o.value ? " checked" : "") +
        ' data-q="' + q + '"><label for="' + id + '"><b>' + o.value + "</b>" + t(o.label) + "</label>";
    });
    return s + "</div></div>";
  }
  function legendHTML() {
    return '<div class="legend">' + DATA.scale.map(function (o) { return "<div><b>" + o.value + "</b>" + t(o.label) + "</div>"; }).join("") + "</div>";
  }
  function questionsBlock() {
    return '<span class="k">' + t(UI.questions_heading) + '</span><div class="twoq">' +
      '<div class="qcard"><b>' + t(UI.q1_label) + "</b><p>" + t(DATA.questions.h1) + "</p></div>" +
      '<div class="qcard"><b>' + t(UI.q2_label) + "</b><p>" + t(DATA.questions.h2) + '<span class="gloss">' + t(DATA.questions.h2_gloss) + "</span></p></div></div>" +
      '<span class="k">' + t(UI.scale_heading) + "</span>" + legendHTML() + '<p class="muted">' + t(UI.scale_note) + "</p>";
  }

  // ---------- views ----------
  function renderIntro() {
    var n = nCards(), started = state && state.started_at && nAnswered() > 0;
    var cta;
    if (!state) cta = "";
    else if (started) cta = '<button type="button" class="btn lg" id="start">' + t(UI.cta_continue, { i: Math.min(state.idx + 1, n) }) + " →</button>";
    else cta = '<button type="button" class="btn lg" id="start">' + t(UI.cta_start) + " →</button>";
    var s = '<div class="view"><section class="hero"><div>' +
      (started ? '<span class="k">' + t(UI.welcome_back) + "</span>" : "") +
      "<h1>" + t(UI.hero_title) + "</h1>" +
      '<p class="lead">' + t(DATA.intro, { n: n }) + "</p>" +
      '<div class="meta"><span>' + iconCards() + t(UI.meta_cards, { n: n }) + "</span><span>" + iconClock() + t(UI.meta_time) + "</span><span>" + iconSave() + t(UI.meta_saved) + "</span></div>" +
      (storageOK ? "" : '<div class="notice">' + t(UI.no_storage) + "</div>") +
      '<div class="row">' + cta + (started ? '<button type="button" class="btn ghost" id="restart" data-armed="0">' + t(UI.start_over) + "</button>" : "") + "</div>" +
      '</div><div class="illus">' + illustration() + "</div></section>";
    if (!state) {
      s += '<section class="card"><h2>' + t(UI.rater_prompt) + '</h2><div class="raters">' + DATA.raters.map(function (r) {
        return '<button type="button" class="rater" data-pick="' + r + '"><b>' + t(UI.rater_names[r]) + "</b><span class=\"muted\">" + t(UI.cta_start) + " →</span></button>";
      }).join("") + "</div></section>";
    }
    s += '<h3 style="margin-top:1.6rem">' + t(UI.how_title) + '</h3><div class="steps">' +
      ['how_1', 'how_2', 'how_3'].map(function (k, i) { return '<div class="step"><span class="n">' + (i + 1) + "</span><div>" + t(UI[k]) + "</div></div>"; }).join("") + "</div>" +
      '<section class="card">' + questionsBlock() + "</section></div>";
    app.innerHTML = s;
  }
  function renderCard(i) {
    var o = state.order[i], r = ROWS[o.id], a = state.answers[akey(o)] || {};
    if (!a.shown_at) { a.shown_at = nowISO(); state.answers[akey(o)] = a; saveState(true); }
    var n = state.order.length, last = i === n - 1, done = !!(a.h1 && a.h2);
    var s = '<div class="view"><div class="grid"><div class="sticky">' + infoCard(r, o.is_anchor) + "</div>" +
      '<section class="card">' +
      questionHTML("h1", UI.q1_label, DATA.questions.h1, null, a.h1) +
      questionHTML("h2", UI.q2_label, DATA.questions.h2, DATA.questions.h2_gloss, a.h2) +
      '<div class="q"><textarea id="note" rows="3" placeholder="' + t(UI.note_placeholder) + '">' + esc(a.note || "") + "</textarea></div>" +
      '<div class="nav"><button type="button" class="btn ghost" id="back"' + (i === 0 ? " disabled" : "") + ">← " + t(UI.back) + "</button>" +
      '<div class="hint" id="hint">' + (done ? "" : t(UI.next_hint)) + "</div>" +
      '<button type="button" class="btn" id="next"' + (done ? "" : " disabled") + ">" + t(last ? UI.review_title : UI.next) + " →</button></div>" +
      '<p class="kbd noprint"><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> ' + t(UI.keys_hint).replace(/^Tip: keys 1 to 4 /i, "") + "</p>" +
      (state.reviewed ? '<div class="row" style="margin-top:.6rem"><button type="button" class="btn link" id="to-review">' + t(UI.back_to_review) + "</button></div>" : "") +
      "</section></div></div>";
    app.innerHTML = s;
    window.scrollTo(0, 0);
  }
  function renderReview() {
    state.reviewed = true;
    var missing = firstOpen() >= 0;
    var s = '<div class="view"><section class="card"><h2>' + t(UI.review_title) + '</h2><p class="lead" style="margin-bottom:1rem">' + t(missing ? UI.unanswered : UI.review_intro) + "</p>" +
      '<ul class="rev">' + state.order.map(function (o, i) {
        var r = ROWS[o.id], a = state.answers[akey(o)] || {};
        function v(x) { return x ? '<b class="' + (x >= 3 ? "" : "lo") + '">' + x + "</b>" : '<b class="lo">–</b>'; }
        return '<li><span class="i">' + (i + 1) + "</span><span>" + (o.is_anchor ? '<span class="star">★</span> ' : "") + t(r.name) + "</span>" +
          '<span class="ans">' + t(UI.q_short_1) + " " + v(a.h1) + "</span>" +
          '<span class="ans">' + t(UI.q_short_2) + " " + v(a.h2) + (a.note ? ' <span title="' + esc(a.note) + '">✎</span>' : "") + "</span>" +
          '<button type="button" class="btn link" data-goto="' + i + '">' + t(UI.edit) + "</button></li>";
      }).join("") + "</ul>" +
      '<div class="nav"><button type="button" class="btn ghost" id="restart" data-armed="0">' + t(UI.start_over) + "</button>" +
      '<div class="hint"></div><button type="button" class="btn lg" id="submit"' + (missing ? " disabled" : "") + ">" + t(UI.submit) + "</button></div></section></div>";
    app.innerHTML = s;
    window.scrollTo(0, 0);
  }
  function records() {
    return state.order.map(function (o, pos) {
      var a = state.answers[akey(o)] || {};
      return {
        round: ROUND, form_version: FORM_VERSION, rater: state.rater, position: pos + 1, atom: o.id,
        is_anchor: o.is_anchor, seen_as_calibration: (o.is_anchor === 0 && DATA.anchors.indexOf(o.id) >= 0) ? 1 : 0,
        h1: a.h1 || "", h2: a.h2 || "", note: a.note || "",
        shown_at: a.shown_at || "", answered_at: a.answered_at || "",
        started_at: state.started_at || "", finished_at: state.finished_at || ""
      };
    });
  }
  var COLS = ["round", "form_version", "rater", "position", "atom", "is_anchor", "seen_as_calibration", "h1", "h2", "note", "shown_at", "answered_at", "started_at", "finished_at"];
  function csvCell(v) {
    var s = String(v == null ? "" : v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(recs) {
    return [COLS.join(",")].concat(recs.map(function (r) { return COLS.map(function (c) { return csvCell(r[c]); }).join(","); })).join("\r\n") + "\r\n";
  }
  function toJSON() {
    return JSON.stringify({ round: ROUND, form_version: FORM_VERSION, rater: state.rater, started_at: state.started_at, finished_at: state.finished_at, records: records() }, null, 2);
  }
  function fileBase() { return "h-screen-round" + ROUND + "-" + state.rater + "-" + FORM_VERSION; }
  function download(name, text, mime) {
    var b = new Blob([text], { type: mime }), u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 0);
  }
  function elapsedText() {
    if (!state.started_at || !state.finished_at) return "";
    var ms = new Date(state.finished_at) - new Date(state.started_at);
    var m = Math.floor(ms / 60000), s = Math.round((ms % 60000) / 1000);
    return m + " min " + s + " s";
  }
  function renderDone() {
    var s = '<div class="view"><section class="card"><div class="done">' +
      '<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="var(--accent-soft)"/><path d="M22 37l9 9 19-20" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      "<h1>" + t(UI.done_title) + '</h1><p class="lead" style="margin:0 auto 1.2rem">' + t(UI.done_summary, { n: state.order.length, t: elapsedText() }) + "</p>" +
      '<div class="row" style="justify-content:center"><button type="button" class="btn lg" id="dl-csv">⬇ ' + t(UI.download_csv) + "</button>" +
      '<button type="button" class="btn ghost" id="dl-json">' + t(UI.download_json) + "</button>" +
      '<button type="button" class="btn ghost" id="copy-csv">' + t(UI.copy_csv) + "</button></div></div>" +
      '<div class="callout">' + t(UI.send_hint) + "</div>" +
      "<details><summary>" + t(UI.preview) + '</summary><pre class="csv" id="csv-preview">' + esc(toCSV(records())) + "</pre></details>" +
      '<div class="row noprint" style="margin-top:1.2rem"><button type="button" class="btn link" id="review">' + t(UI.review) + "</button>" +
      '<button type="button" class="btn link" id="restart" data-armed="0">' + t(UI.start_over) + "</button></div></section></div>";
    app.innerHTML = s;
    window.scrollTo(0, 0);
  }
  function renderPrint() {
    var fixed = DATA.anchors.map(function (id) { return { id: id, is_anchor: 1 }; }).concat(
      DATA.rows.filter(function (r) { return DATA.anchor_policy === "repeat" || DATA.anchors.indexOf(r.id) < 0; })
        .map(function (r) { return { id: r.id, is_anchor: 0 }; }));
    var s = '<div class="card"><h1>' + t(DATA.title) + '</h1><p class="lead">' + t(DATA.intro, { n: fixed.length }) + '</p><p class="muted">' + t(UI.print_title) + "</p>" +
      "<p>" + t(UI.rater) + ": " + DATA.raters.map(function (r) { return "☐ " + t(UI.rater_names[r]); }).join(" &nbsp; ") +
      " &nbsp; <code>" + t(UI.version) + " " + FORM_VERSION + "</code></p>" + questionsBlock() +
      '<div class="row noprint"><button type="button" class="btn" onclick="window.print()">' + t(UI.print_button) + "</button></div></div>";
    fixed.forEach(function (o, i) {
      var r = ROWS[o.id];
      s += '<div class="card"><span class="k">' + t(UI.card_of, { i: i + 1, n: fixed.length }) + "</span>" +
        (o.is_anchor ? '<div class="ribbon">★ ' + t(UI.calibration) + "</div>" : "") + '<h2 class="atom">' + t(r.name) + '</h2><p class="def">' + t(r.prose) + "</p>" +
        questionHTML("h1", UI.q1_label, DATA.questions.h1, null, null, "-p" + i) +
        questionHTML("h2", UI.q2_label, DATA.questions.h2, DATA.questions.h2_gloss, null, "-p" + i) +
        '<div class="q"><textarea rows="2" placeholder="' + t(UI.note_placeholder) + '"></textarea></div></div>';
    });
    app.innerHTML = s;
  }
  function render() {
    renderChrome();
    if (MODE === "print") { renderPrint(); return; }
    if (!state || state.view === "intro") renderIntro();
    else if (state.view === "card") renderCard(state.idx);
    else if (state.view === "review") renderReview();
    else renderDone();
  }

  // ---------- events ----------
  function goNext() {
    var o = state.order[state.idx];
    if (!answered(o)) { var h = document.getElementById("hint"); if (h) { h.className = "hint warn"; h.textContent = fill(UI.unanswered); } return; }
    if (state.idx === state.order.length - 1 || state.reviewed) state.view = "review";
    else state.idx += 1;
    saveState(true); render();
  }
  app.addEventListener("click", function (ev) {
    var el = ev.target.closest("button, a"); if (!el) return;
    if (el.hasAttribute("data-pick")) {
      var r = el.getAttribute("data-pick");
      var u = new URL(location.href); u.searchParams.set("rater", r); history.replaceState(null, "", u.toString());
      state = loadState(r) || newState(r); saveState(true); render(); return;
    }
    if (!state) return;
    if (el.id === "start") { if (!state.started_at) state.started_at = nowISO(); state.view = "card"; if (nAnswered() > 0 && firstOpen() >= 0) state.idx = Math.min(state.idx, state.order.length - 1); saveState(true); render(); return; }
    if (el.id === "restart") {
      if (el.getAttribute("data-armed") !== "1") { el.setAttribute("data-armed", "1"); el.textContent = fill(UI.start_over_confirm); return; }
      var rr = state.rater; try { localStorage.removeItem(skey(rr)); } catch (e) {}
      state = newState(rr); saveState(true); render(); return;
    }
    if (el.id === "next") { goNext(); return; }
    if (el.id === "back") { if (state.idx > 0) { state.idx -= 1; saveState(true); render(); } return; }
    if (el.id === "to-review" || el.id === "review") { state.view = "review"; saveState(true); render(); return; }
    if (el.id === "submit") { if (firstOpen() >= 0) return; state.view = "done"; if (!state.finished_at) state.finished_at = nowISO(); saveState(true); render(); return; }
    if (el.hasAttribute("data-goto")) { ev.preventDefault(); state.view = "card"; state.idx = +el.getAttribute("data-goto"); saveState(true); render(); return; }
    if (el.id === "dl-csv") { download(fileBase() + ".csv", toCSV(records()), "text/csv;charset=utf-8"); return; }
    if (el.id === "dl-json") { download(fileBase() + ".json", toJSON(), "application/json;charset=utf-8"); return; }
    if (el.id === "copy-csv") {
      var txt = toCSV(records()), done = function () { toast(fill(UI.copied)); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt); done(); });
      else { fallbackCopy(txt); done(); }
      return;
    }
  });
  document.getElementById("home").addEventListener("click", function (ev) {
    ev.preventDefault(); if (!state || MODE === "print") return; state.view = "intro"; saveState(true); render();
  });
  function fallbackCopy(txt) {
    var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {} ta.remove();
  }
  function setAnswer(q, v) {
    var o = state.order[state.idx], a = state.answers[akey(o)] || {};
    a[q] = v;
    if (a.h1 && a.h2) a.answered_at = nowISO();
    state.answers[akey(o)] = a; saveState(); renderChrome();
    var nx = document.getElementById("next"), h = document.getElementById("hint");
    if (a.h1 && a.h2) { if (nx) nx.disabled = false; if (h) { h.className = "hint"; h.textContent = ""; } }
  }
  app.addEventListener("change", function (ev) {
    if (!state || state.view !== "card") return;
    var el = ev.target; if (el.type !== "radio") return;
    setAnswer(el.getAttribute("data-q"), +el.value);
  });
  app.addEventListener("input", function (ev) {
    if (!state || state.view !== "card" || ev.target.id !== "note") return;
    var o = state.order[state.idx], a = state.answers[akey(o)] || {};
    a.note = ev.target.value; state.answers[akey(o)] = a; saveState();
  });
  document.addEventListener("keydown", function (ev) {
    if (!state || state.view !== "card" || MODE === "print") return;
    if (ev.target && (ev.target.tagName === "TEXTAREA" || ev.target.tagName === "INPUT" && ev.target.type === "text")) return;
    if (ev.key >= "1" && ev.key <= "4") {
      var o = state.order[state.idx], a = state.answers[akey(o)] || {};
      var q = a.h1 ? "h2" : "h1";
      var inp = document.getElementById(q + "-" + ev.key);
      if (inp) { inp.checked = true; setAnswer(q, +ev.key); ev.preventDefault(); }
    } else if (ev.key === "Enter") { goNext(); ev.preventDefault(); }
  });

  // ---------- boot ----------
  var rater = params.get("rater");
  if (DATA.raters.indexOf(rater) < 0) rater = null;
  if (rater) { state = loadState(rater) || newState(rater); if (state.form_version !== FORM_VERSION) state = newState(rater); saveState(true); }
  render();
})();
</script>
</body>
</html>
