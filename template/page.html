<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Atom audit · round __ROUND__</title>
<style>
:root{--bg:#f6f4ef;--card:#ffffff;--ink:#1f1d1a;--muted:#6f6a62;--line:#e4dfd5;--accent:#3a5fcd;--accent-ink:#ffffff;--accent-soft:#e9eefb;--warn:#b3261e;--chip:#efece5;--ok:#1d7a4a}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--card:#1e1c19;--ink:#ecebe6;--muted:#a49f95;--line:#33302b;--accent:#8fa5ff;--accent-ink:#0e1533;--accent-soft:#232a45;--warn:#ff8a80;--chip:#2a2723;--ok:#6fd39a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.hwrap{max-width:720px;margin:0 auto;padding:.7rem 1rem .6rem}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.brand{font-weight:700;letter-spacing:.01em}
.count{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--line);border-radius:3px;margin-top:.55rem;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .25s}
main{max-width:720px;margin:0 auto;padding:1.4rem 1rem 5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.5rem 1.6rem;margin-bottom:1rem;box-shadow:0 1px 2px rgba(0,0,0,.03)}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .8rem}
h2.atom{font-size:1.55rem;line-height:1.25;margin:.2rem 0 1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}
.chip{display:inline-block;font-size:.8rem;padding:.15rem .6rem;border-radius:999px;background:var(--chip);color:var(--muted)}
.chip.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.chip.incoming{background:var(--accent-soft);color:var(--accent)}
.ribbon{display:flex;align-items:center;gap:.5rem;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:.55rem .85rem;margin:0 0 1rem;font-weight:600}
.lead{font-size:1.1rem;margin:0 0 1rem}
.def{font-size:1.12rem;margin:0 0 1rem}
.k{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.15rem}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:.9rem 1.2rem;margin:0 0 1.1rem}
.facts>div{background:var(--bg);border-radius:10px;padding:.6rem .8rem}
.phr{list-style:none;margin:0;padding:0}
.phr{display:flex;flex-wrap:wrap;gap:.5rem}
.phr li{background:var(--bg);border-radius:10px;padding:.4rem .75rem}
.phr q{quotes:"“" "”";font-weight:600}
.phr small{color:var(--muted);font-size:.84rem;margin-left:.4rem}
.q{padding:1.1rem 0 .4rem;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:.2rem}
.qlabel{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:.25rem}
.q p{margin:0 0 .7rem;font-weight:600;font-size:1.08rem}
.gloss{display:block;font-weight:400;color:var(--muted);font-size:.92rem;margin-top:.25rem}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
@media (max-width:560px){.seg{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr}.card{padding:1.2rem 1.1rem}}
.seg input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.seg label{display:flex;flex-direction:column;align-items:center;gap:.15rem;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:.7rem .4rem;text-align:center;cursor:pointer;font-size:.9rem;line-height:1.25;user-select:none;transition:border-color .15s,background .15s}
.seg label b{display:inline-flex;align-items:center;justify-content:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--chip);font-size:1rem}
.seg label:hover{border-color:var(--accent)}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:checked+label b{background:rgba(255,255,255,.25);color:inherit}
.seg input:focus-visible+label{outline:3px solid var(--accent-soft);outline-offset:1px;border-color:var(--accent)}
textarea{width:100%;min-height:4.6rem;border:1.5px solid var(--line);border-radius:12px;padding:.7rem .85rem;font:inherit;font-size:1rem;background:var(--card);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:1.2rem;flex-wrap:wrap}
.hint{flex:1;color:var(--muted);font-size:.9rem;min-width:12rem}
.hint.warn{color:var(--warn)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:.8rem 1.4rem;font:inherit;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.big{width:100%;font-size:1.1rem;padding:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.btn.ghost:hover{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.bullets{margin:0 0 1.2rem;padding-left:1.2rem}
.bullets li{margin:.25rem 0}
.twoq{display:grid;gap:.7rem;margin:0 0 1rem}
.qcard{background:var(--bg);border-radius:12px;padding:.8rem 1rem}
.qcard b{color:var(--accent);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:.15rem}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.4rem 0 .4rem}
@media (max-width:560px){.legend{grid-template-columns:1fr 1fr}}
.legend div{border:1.5px solid var(--line);border-radius:12px;padding:.5rem .3rem;text-align:center;font-size:.9rem;line-height:1.25}
.legend div b{display:block;font-size:1.05rem}
.muted{color:var(--muted);font-size:.92rem}
.callout{background:var(--accent-soft);border-radius:12px;padding:.9rem 1rem;margin:1rem 0}
.ok{color:var(--ok);font-weight:600}
.list{list-style:none;padding:0;margin:.5rem 0}
.list li{display:flex;justify-content:space-between;gap:.5rem;border-bottom:1px solid var(--line);padding:.4rem 0;font-size:.95rem}
.list a{color:var(--accent)}
pre.csv{white-space:pre;overflow:auto;font-size:.74rem;background:var(--bg);padding:.7rem;border-radius:10px;max-height:14rem;margin:.5rem 0 0}
details summary{cursor:pointer;color:var(--muted)}
footer.stamp{color:var(--muted);font-size:.82rem;margin-top:1.4rem;text-align:center}
footer.stamp code{font-size:.78rem}
@media print{
  header,.nav,.noprint{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .card{break-inside:avoid;border-color:#999;box-shadow:none;padding:.7rem .9rem;margin-bottom:.6rem}
  .seg label{border-color:#777;padding:.3rem}
  .seg label b{background:none;border:1px solid #777}
  textarea{min-height:3rem;border-color:#777;background:#fff}
  .facts>div,.qcard{background:#fff;border:1px solid #ddd}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="hrow"><div class="brand" id="brand"></div><div class="count" id="count"></div></div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
</div></header>
<main id="app"></main>
<script id="rows-json" type="application/json">__ROWS_JSON__</script>
<script>
__ORDER_JS__
</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("rows-json").textContent);
  var FORM_VERSION = "__FORM_VERSION__";
  var ROUND = DATA.round;
  var UI = DATA.ui;
  var ORDER = window.HOrder;
  var ROWS = {};
  DATA.rows.forEach(function (r) { ROWS[r.id] = r; });
  var params = new URLSearchParams(location.search);
  var MODE = params.get("mode") === "print" ? "print" : "rate";
  var app = document.getElementById("app");
  var state = null;

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fill(s, vars) {
    return String(s).replace(/\{(\w+)\}/g, function (m, k) { return vars && k in vars ? vars[k] : m; });
  }
  function t(s, vars) { return esc(fill(s, vars)); }
  function nowISO() { return new Date().toISOString(); }
  function skey(r) { return "hscreen:" + ROUND + ":" + FORM_VERSION + ":" + r; }
  function akey(o) { return o.id + "#" + o.is_anchor; }
  function loadState(r) {
    try { var s = localStorage.getItem(skey(r)); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function saveState() {
    if (!state) return;
    try { localStorage.setItem(skey(state.rater), JSON.stringify(state)); } catch (e) { /* no storage: still works for one sitting */ }
  }
  function newState(r) {
    return {
      round: ROUND, form_version: FORM_VERSION, rater: r,
      started_at: null, finished_at: null, idx: 0, view: "intro",
      order: ORDER.buildOrder(DATA.rows.map(function (x) { return x.id; }), DATA.anchors, DATA.anchor_policy, FORM_VERSION, r),
      answers: {}
    };
  }
  function answered(o) { var a = state.answers[akey(o)]; return !!(a && a.h1 && a.h2); }
  function nAnswered() { return state.order.filter(answered).length; }
  function nCards() { return state ? state.order.length : DATA.anchors.length + DATA.rows.length; }

  // ---------- header ----------
  function renderHeader() {
    document.getElementById("brand").textContent = DATA.title;
    var c = document.getElementById("count");
    if (state && state.view === "card") c.textContent = fill(UI.card_of, { i: state.idx + 1, n: state.order.length });
    else if (state) c.textContent = nAnswered() + " / " + state.order.length;
    else c.textContent = "";
    document.getElementById("bar").style.width = state ? Math.round(100 * nAnswered() / state.order.length) + "%" : "0%";
  }
  function stampHTML() {
    return '<footer class="stamp">' + (state ? t(UI.rating_as) + ": " + t(UI.rater_names[state.rater]) + " · " : "") +
      t(DATA.round_label) + " · " + t(UI.version) + " <code>" + FORM_VERSION + "</code></footer>";
  }

  // ---------- pieces ----------
  function phrasesHTML(r) {
    return r.phrases.map(function (p) {
      return "<li><q>" + esc(p.text) + "</q><small>" + esc(p.short_source || "") + "</small></li>";
    }).join("");
  }
  function titleHTML(r) {
    return '<h2 class="atom">' + t(r.name) + "</h2>";
  }
  function descHTML(r) {
    return '<span class="k">' + t(UI.definition) + '</span><p class="def">' + t(r.definition) + "</p>" +
      '<div class="facts"><div><span class="k">' + t(UI.unit) + "</span>" + t(r.unit) + "</div>" +
      '<div><span class="k">' + t(UI.range) + "</span>" + t(r.range) + "</div></div>" +
      '<span class="k">' + t(UI.phrases) + '</span><ul class="phr">' + phrasesHTML(r) + "</ul>";
  }
  function questionHTML(q, label, text, gloss, val, suffix) {
    var name = q + (suffix || "");
    var s = '<div class="q"><div class="qlabel">' + t(label) + "</div><p>" + t(text) +
      (gloss ? '<span class="gloss">' + t(gloss) + "</span>" : "") + '</p><div class="seg">';
    DATA.scale.forEach(function (o) {
      var id = name + "-" + o.value;
      s += '<input type="radio" name="' + name + '" id="' + id + '" value="' + o.value + '"' + (val === o.value ? " checked" : "") +
        ' data-q="' + q + '"><label for="' + id + '"><b>' + o.value + "</b>" + t(o.label) + "</label>";
    });
    return s + "</div></div>";
  }
  function legendHTML() {
    return '<div class="legend">' + DATA.scale.map(function (o) {
      return "<div><b>" + o.value + "</b>" + t(o.label) + "</div>";
    }).join("") + "</div>";
  }
  function introBody() {
    return "<h1>" + t(DATA.title) + ' <span class="chip">' + t(DATA.round_label) + "</span></h1>" +
      '<p class="lead">' + t(DATA.intro, { n: nCards() }) + "</p>" +
      '<ul class="bullets"><li>' + t(UI.bullet_time) + "</li><li>" + t(UI.bullet_saved) + "</li><li>" + t(UI.bullet_send) + "</li></ul>" +
      '<span class="k">' + t(UI.questions_heading) + '</span><div class="twoq">' +
      '<div class="qcard"><b>' + t(UI.q1_label) + "</b>" + t(DATA.questions.h1) + "</div>" +
      '<div class="qcard"><b>' + t(UI.q2_label) + "</b>" + t(DATA.questions.h2) + '<span class="gloss">' + t(DATA.questions.h2_gloss) + "</span></div></div>" +
      '<span class="k">' + t(UI.scale_heading) + "</span>" + legendHTML() + '<p class="muted">' + t(UI.scale_note) + "</p>";
  }

  // ---------- views ----------
  function renderIntro() {
    var s = '<div class="card">' + introBody();
    if (!state) {
      s += '<span class="k">' + t(UI.pick_rater) + '</span><div class="row">' + DATA.raters.map(function (r) {
        return '<button type="button" class="btn ghost" data-pick="' + r + '">' + t(UI.rater_names[r]) + "</button>";
      }).join("") + "</div>";
    } else {
      var started = state.started_at && nAnswered() > 0;
      s += '<button type="button" class="btn big" id="start">' + t(started ? UI["continue"] : UI.start) + "</button>" +
        (started ? '<div class="row" style="margin-top:.8rem"><button type="button" class="btn ghost" id="restart" data-armed="0">' + t(UI.start_over) + "</button></div>" : "");
    }
    s += "</div>" + stampHTML();
    app.innerHTML = s;
  }
  function renderCard(i) {
    var o = state.order[i], r = ROWS[o.id], a = state.answers[akey(o)] || {};
    if (!a.shown_at) { a.shown_at = nowISO(); state.answers[akey(o)] = a; saveState(); }
    var n = state.order.length, last = i === n - 1, done = !!(a.h1 && a.h2);
    var s = '<article class="card">' +
      (o.is_anchor ? '<div class="ribbon">★ ' + t(UI.calibration) + "</div>" : "") +
      titleHTML(r) + descHTML(r) + "</article>" +
      '<section class="card">' +
      questionHTML("h1", UI.q1_label, DATA.questions.h1, null, a.h1) +
      questionHTML("h2", UI.q2_label, DATA.questions.h2, DATA.questions.h2_gloss, a.h2) +
      '<div class="q"><textarea id="note" rows="3" placeholder="' + t(UI.note_placeholder) + '">' + esc(a.note || "") + "</textarea></div>" +
      '<div class="nav"><button type="button" class="btn ghost" id="back"' + (i === 0 ? " disabled" : "") + ">← " + t(UI.back) + "</button>" +
      '<div class="hint" id="hint">' + (done ? "" : t(UI.next_hint)) + "</div>" +
      '<button type="button" class="btn" id="next"' + (done ? "" : " disabled") + ">" + t(last ? UI.finish : UI.next) + (last ? "" : " →") + "</button></div>" +
      '<p class="muted noprint" style="margin:.8rem 0 0">' + t(UI.keys_hint) + "</p></section>" + stampHTML();
    app.innerHTML = s;
    window.scrollTo(0, 0);
  }
  function records() {
    return state.order.map(function (o, pos) {
      var a = state.answers[akey(o)] || {};
      return {
        round: ROUND, form_version: FORM_VERSION, rater: state.rater, position: pos + 1, atom: o.id,
        is_anchor: o.is_anchor, seen_as_calibration: (o.is_anchor === 0 && DATA.anchors.indexOf(o.id) >= 0) ? 1 : 0,
        h1: a.h1 || "", h2: a.h2 || "", note: a.note || "",
        shown_at: a.shown_at || "", answered_at: a.answered_at || "",
        started_at: state.started_at || "", finished_at: state.finished_at || ""
      };
    });
  }
  var COLS = ["round", "form_version", "rater", "position", "atom", "is_anchor", "seen_as_calibration", "h1", "h2", "note", "shown_at", "answered_at", "started_at", "finished_at"];
  function csvCell(v) {
    var s = String(v == null ? "" : v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(recs) {
    return [COLS.join(",")].concat(recs.map(function (r) { return COLS.map(function (c) { return csvCell(r[c]); }).join(","); })).join("\r\n") + "\r\n";
  }
  function toJSON() {
    return JSON.stringify({ round: ROUND, form_version: FORM_VERSION, rater: state.rater, started_at: state.started_at, finished_at: state.finished_at, records: records() }, null, 2);
  }
  function fileBase() { return "h-screen-round" + ROUND + "-" + state.rater + "-" + FORM_VERSION; }
  function download(name, text, mime) {
    var b = new Blob([text], { type: mime }), u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 0);
  }
  function elapsedText() {
    if (!state.started_at || !state.finished_at) return "";
    var ms = new Date(state.finished_at) - new Date(state.started_at);
    var m = Math.floor(ms / 60000), s = Math.round((ms % 60000) / 1000);
    return m + " min " + s + " s";
  }
  function renderFinish() {
    var missing = state.order.map(function (o, i) { return answered(o) ? null : i; }).filter(function (x) { return x !== null; });
    var s = '<div class="card">';
    if (missing.length) {
      s += "<h1>" + t(UI.review) + '</h1><p class="hint warn">' + t(UI.unanswered) + '</p><ul class="list">' + missing.map(function (i) {
        return "<li><span>" + (i + 1) + ". " + t(ROWS[state.order[i].id].name) + '</span><a href="#" data-goto="' + i + '">' + t(UI.jump) + "</a></li>";
      }).join("") + "</ul>";
    } else {
      s += "<h1>" + t(UI.thanks) + '</h1><p class="lead">' + t(UI.finish_summary, { n: state.order.length, t: elapsedText() }) + "</p>" +
        '<button type="button" class="btn big" id="dl-csv">⬇ ' + t(UI.download_csv) + "</button>" +
        '<div class="row" style="margin-top:.7rem"><button type="button" class="btn ghost" id="dl-json">' + t(UI.download_json) + "</button>" +
        '<button type="button" class="btn ghost" id="copy-csv">' + t(UI.copy_csv) + '</button><span class="ok" id="copied"></span></div>' +
        '<div class="callout">' + t(UI.send_hint) + "</div>" +
        "<details><summary>" + t(UI.preview) + '</summary><pre class="csv" id="csv-preview">' + esc(toCSV(records())) + "</pre></details>";
    }
    s += '<div class="row noprint" style="margin-top:1.2rem"><button type="button" class="btn ghost" id="review">' + t(UI.review) + "</button>" +
      '<button type="button" class="btn ghost" id="restart" data-armed="0">' + t(UI.start_over) + "</button></div></div>" + stampHTML();
    app.innerHTML = s;
    window.scrollTo(0, 0);
  }
  function renderPrint() {
    var fixed = DATA.anchors.map(function (id) { return { id: id, is_anchor: 1 }; }).concat(
      DATA.rows.filter(function (r) { return DATA.anchor_policy === "repeat" || DATA.anchors.indexOf(r.id) < 0; })
        .map(function (r) { return { id: r.id, is_anchor: 0 }; }));
    var s = '<div class="card">' + introBody() + '<p class="muted">' + t(UI.print_title) + "</p>" +
      "<p>" + t(UI.rater) + ": " + DATA.raters.map(function (r) { return "☐ " + t(UI.rater_names[r]); }).join(" &nbsp; ") +
      ' &nbsp; <span class="chip code">' + t(UI.version) + " " + FORM_VERSION + "</span></p>" +
      '<div class="row noprint"><button type="button" class="btn" onclick="window.print()">' + t(UI.print_button) + "</button></div></div>";
    fixed.forEach(function (o, i) {
      var r = ROWS[o.id];
      s += '<div class="card"><div class="count">' + t(UI.card_of, { i: i + 1, n: fixed.length }) + "</div>" +
        (o.is_anchor ? '<div class="ribbon">★ ' + t(UI.calibration) + "</div>" : "") + titleHTML(r) + descHTML(r) +
        questionHTML("h1", UI.q1_label, DATA.questions.h1, null, null, "-p" + i) +
        questionHTML("h2", UI.q2_label, DATA.questions.h2, DATA.questions.h2_gloss, null, "-p" + i) +
        '<div class="q"><textarea rows="2" placeholder="' + t(UI.note_placeholder) + '"></textarea></div></div>';
    });
    app.innerHTML = s;
  }
  function render() {
    renderHeader();
    if (MODE === "print") { renderPrint(); return; }
    if (!state || state.view === "intro") renderIntro();
    else if (state.view === "card") renderCard(state.idx);
    else renderFinish();
  }

  // ---------- events ----------
  function goNext() {
    var o = state.order[state.idx];
    if (!answered(o)) { var h = document.getElementById("hint"); if (h) { h.className = "hint warn"; h.textContent = fill(UI.unanswered); } return; }
    if (state.idx === state.order.length - 1) { state.view = "finish"; if (!state.finished_at) state.finished_at = nowISO(); }
    else state.idx += 1;
    saveState(); render();
  }
  app.addEventListener("click", function (ev) {
    var el = ev.target.closest("button, a"); if (!el) return;
    if (el.hasAttribute("data-pick")) {
      var r = el.getAttribute("data-pick");
      var u = new URL(location.href); u.searchParams.set("rater", r); history.replaceState(null, "", u.toString());
      state = loadState(r) || newState(r); saveState(); render(); return;
    }
    if (!state) return;
    if (el.id === "start") { if (!state.started_at) state.started_at = nowISO(); state.view = "card"; saveState(); render(); return; }
    if (el.id === "restart") {
      if (el.getAttribute("data-armed") !== "1") { el.setAttribute("data-armed", "1"); el.textContent = fill(UI.start_over_confirm); return; }
      var rr = state.rater; try { localStorage.removeItem(skey(rr)); } catch (e) {}
      state = newState(rr); saveState(); render(); return;
    }
    if (el.id === "next") { goNext(); return; }
    if (el.id === "back") { if (state.idx > 0) { state.idx -= 1; saveState(); render(); } return; }
    if (el.id === "review") { state.view = "card"; state.idx = 0; saveState(); render(); return; }
    if (el.hasAttribute("data-goto")) { ev.preventDefault(); state.view = "card"; state.idx = +el.getAttribute("data-goto"); saveState(); render(); return; }
    if (el.id === "dl-csv") { download(fileBase() + ".csv", toCSV(records()), "text/csv;charset=utf-8"); return; }
    if (el.id === "dl-json") { download(fileBase() + ".json", toJSON(), "application/json;charset=utf-8"); return; }
    if (el.id === "copy-csv") {
      var txt = toCSV(records()), done = function () { document.getElementById("copied").textContent = fill(UI.copied); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt); done(); });
      else { fallbackCopy(txt); done(); }
      return;
    }
  });
  function fallbackCopy(txt) {
    var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {} ta.remove();
  }
  function setAnswer(q, v) {
    var o = state.order[state.idx], a = state.answers[akey(o)] || {};
    a[q] = v;
    if (a.h1 && a.h2) a.answered_at = nowISO();
    state.answers[akey(o)] = a; saveState(); renderHeader();
    var nx = document.getElementById("next"), h = document.getElementById("hint");
    if (a.h1 && a.h2) { if (nx) nx.disabled = false; if (h) { h.className = "hint"; h.textContent = ""; } }
  }
  app.addEventListener("change", function (ev) {
    if (!state || state.view !== "card") return;
    var el = ev.target; if (el.type !== "radio") return;
    setAnswer(el.getAttribute("data-q"), +el.value);
  });
  app.addEventListener("input", function (ev) {
    if (!state || state.view !== "card" || ev.target.id !== "note") return;
    var o = state.order[state.idx], a = state.answers[akey(o)] || {};
    a.note = ev.target.value; state.answers[akey(o)] = a; saveState();
  });
  document.addEventListener("keydown", function (ev) {
    if (!state || state.view !== "card" || MODE === "print") return;
    if (ev.target && ev.target.tagName === "TEXTAREA") return;
    if (ev.key >= "1" && ev.key <= "4") {
      var o = state.order[state.idx], a = state.answers[akey(o)] || {};
      var q = a.h1 ? "h2" : "h1";
      var inp = document.getElementById(q + "-" + ev.key);
      if (inp) { inp.checked = true; setAnswer(q, +ev.key); ev.preventDefault(); }
    } else if (ev.key === "Enter") { goNext(); ev.preventDefault(); }
  });

  // ---------- boot ----------
  var rater = params.get("rater");
  if (DATA.raters.indexOf(rater) < 0) rater = null;
  if (rater) { state = loadState(rater) || newState(rater); if (state.form_version !== FORM_VERSION) state = newState(rater); saveState(); }
  render();
})();
</script>
</body>
</html>
